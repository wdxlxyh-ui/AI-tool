<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIDC AI电力系统 可视化大屏</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root{
  --bg0:#04070e; --bg1:#070b15; --panel:rgba(10,18,30,0.6);
  --teal:#2de0c0; --cyan:#33d1ff; --green:#00ff9d; --line:rgba(45,224,192,0.18);
  --txt:#c5d3e0; --dim:#5f7385;
}
/* ---------- top nav ---------- */
#top-nav{height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:linear-gradient(180deg,rgba(6,12,22,0.95),rgba(6,12,22,0.7));
  border-bottom:1px solid var(--line);position:relative;z-index:50;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-mark{color:var(--teal);font-size:20px;text-shadow:0 0 10px var(--teal);}
.logo-en{font-size:19px;font-weight:800;letter-spacing:.5px;color:#eaf6f2;}
.logo-cn{font-size:17px;font-weight:700;color:#9fb4c2;}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,0.02);padding:4px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);}
.tab-btn{padding:7px 18px;border:none;background:transparent;color:var(--dim);font-size:13px;
  cursor:pointer;border-radius:5px;transition:all .25s;white-space:nowrap;font-family:inherit;}
.tab-btn:hover{color:var(--teal);}
.tab-btn.active{color:#04121a;font-weight:700;
  background:linear-gradient(135deg,var(--teal),var(--cyan));
  box-shadow:0 0 14px rgba(45,224,192,0.5);}
.time{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.5px;}
main#content{flex:1;overflow:hidden;position:relative;}
/* ---------- layout ---------- */
.page{display:none;height:100%;padding:14px 18px;}
.page.active{display:flex;gap:14px;}
.panel-left,.panel-right{width:290px;min-width:290px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.panel-center{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;}
/* overview special: wide scene + 2x2 grid */
.ov-grid{width:520px;min-width:520px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:100%;}
/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,rgba(12,22,36,0.7),rgba(8,14,24,0.55));
  border:1px solid var(--line);border-radius:8px;padding:13px;position:relative;overflow:hidden;
  backdrop-filter:blur(4px);}
.card::before{content:'';position:absolute;top:0;left:12px;width:26px;height:2px;
  background:linear-gradient(90deg,var(--teal),transparent);}
.card-corner::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-top:1px solid var(--teal);border-right:1px solid var(--teal);opacity:.6;}
.card-title{font-size:13px;color:#dff5ef;margin-bottom:9px;font-weight:600;display:flex;align-items:center;gap:7px;letter-spacing:.5px;}
.card-title::before{content:'';width:3px;height:12px;background:linear-gradient(180deg,var(--teal),var(--cyan));border-radius:2px;box-shadow:0 0 6px var(--teal);}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.metric-item{background:rgba(45,224,192,0.04);border:1px solid rgba(45,224,192,0.1);border-radius:6px;padding:10px;text-align:center;}
.metric-value{font-size:22px;font-weight:800;color:var(--teal);text-shadow:0 0 10px rgba(45,224,192,0.4);font-variant-numeric:tabular-nums;}
.metric-label{font-size:11px;color:var(--dim);margin-top:3px;}
.metric-unit{font-size:10px;color:#4a6472;}
.chart-container{width:100%;height:200px;}
.chart-container-sm{width:100%;height:100%;min-height:150px;}
.chart-container-lg{width:100%;height:280px;}
/* ---------- scene ---------- */
.scene-3d{flex:1;position:relative;overflow:hidden;min-height:300px;border-radius:8px;
  background:radial-gradient(ellipse at 50% 55%,rgba(20,70,90,0.25),transparent 65%);}
.scene-3d canvas{position:absolute;inset:0;width:100%;height:100%;}
.scene-label{position:absolute;top:14px;left:16px;font-size:12px;color:var(--dim);letter-spacing:1px;z-index:2;}
.scene-label b{color:var(--teal);}
/* ---------- sub tabs ---------- */
.sub-tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.sub-tab-btn{padding:6px 14px;border:1px solid var(--line);background:rgba(255,255,255,0.02);
  color:var(--dim);font-size:12px;cursor:pointer;border-radius:5px;transition:all .25s;font-family:inherit;}
.sub-tab-btn:hover{color:var(--teal);border-color:var(--teal);}
.sub-tab-btn.active{color:#04121a;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--cyan));border-color:transparent;box-shadow:0 0 12px rgba(45,224,192,0.4);}
.sub-page{display:none;flex:1;gap:12px;}
.sub-page.active{display:flex;}
/* ---------- misc ---------- */
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle;}
.status-online{background:var(--green);box-shadow:0 0 6px var(--green);}
.status-warning{background:#f5a623;box-shadow:0 0 6px #f5a623;}
.info-list{font-size:12px;line-height:2;}
.info-list .k{color:var(--dim);}
.info-list .v{color:var(--teal);float:right;}
.agent-card{background:rgba(45,224,192,0.04);border:1px solid rgba(45,224,192,0.1);border-radius:6px;padding:9px;margin-bottom:7px;}
.agent-name{font-size:12px;font-weight:600;color:var(--teal);margin-bottom:3px;}
.agent-desc{font-size:11px;color:var(--dim);line-height:1.5;}
.strat-item{padding:7px 10px;border-radius:5px;margin-bottom:5px;font-size:12px;cursor:pointer;border:1px solid transparent;transition:all .2s;}
.strat-item:hover{border-color:var(--teal);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(45,224,192,0.3);border-radius:2px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
html,body{height:100%;}
body {
  font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(20,60,80,0.35), transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(30,80,120,0.2), transparent 55%),
    linear-gradient(160deg,#04070e 0%,#060a13 50%,#04070e 100%);
  color:var(--txt); height:100vh; overflow:hidden;
}
#app{height:100vh;display:flex;flex-direction:column;}
</style>
</head>

<script>
// ============ MOCK DATA ============
const MOCK={overview:{itLoadIncrease:20,tokenEnergy:1.2,greenRatio:82,pue:1.13,windPower:45.6,solarPower:32.1,bessSoc:78,totalLoad:96.5},
  greenToken:{windOutput:[42,44,46,45,43,47,48,46,44,42,40,38,36,38,42,45,47,49,48,46,44,43,41,39],solarOutput:[0,0,0,0,5,12,22,30,35,38,36,34,32,28,22,15,8,3,0,0,0,0,0,0],bessSoc:[80,78,76,74,72,70,68,72,76,80,82,84,86,84,82,80,78,76,74,72,70,68,66,64],curtailRate:5.2,greenPct:100,tokenEnergy:1.1},
  carbon:{scope1:120,scope2:450,totalReduction:380,neutralProgress:67,intensity:0.42},
  prediction:{weather:{temp:[],wind:[],solar:[]},power:[],load:[],task:[]},
  aiPower:{windCurve:[],storageCurve:[],loadCurve:[],sstCurve:[]},
  ov:{itLoad:[],tokenBar:[],green:[],pue:[]}};
for(let i=0;i<24;i++){
  MOCK.prediction.weather.temp.push(25+Math.sin(i/4)*8+Math.random()*2);
  MOCK.prediction.weather.wind.push(6+Math.sin(i/3)*3+Math.random());
  MOCK.prediction.weather.solar.push(i>=6&&i<=18?Math.sin((i-6)/12*Math.PI)*800+Math.random()*50:0);
  MOCK.prediction.power.push(40+Math.sin(i/4)*15+Math.random()*5);
  MOCK.prediction.load.push(85+Math.sin(i/6)*10+Math.random()*3);
  MOCK.prediction.task.push(70+Math.sin(i/5)*20+Math.random()*5);
  MOCK.aiPower.windCurve.push(45+Math.sin(i/3)*12+Math.random()*3);
  MOCK.aiPower.storageCurve.push(20+Math.cos(i/4)*15+Math.random()*2);
  MOCK.aiPower.loadCurve.push(90+Math.sin(i/5)*8+Math.random()*2);
  MOCK.aiPower.sstCurve.push(30+Math.sin(i/3.5)*10+Math.random()*2);
  MOCK.ov.itLoad.push(78+Math.sin(i/3)*10+Math.random()*4);
  MOCK.ov.tokenBar.push(0.9+Math.abs(Math.sin(i/2))*0.5+Math.random()*0.1);
  MOCK.ov.green.push(80+Math.sin(i/5)*6+Math.random()*3);
  MOCK.ov.pue.push(1.1+Math.abs(Math.sin(i/4))*0.08+Math.random()*0.02);
}
const TABS=[{id:'overview',name:'总览'},{id:'green-token',name:'绿色Token生产'},{id:'carbon',name:'碳管理'},{id:'prediction',name:'多维预测'},{id:'ai-power',name:'AI电力系统'},{id:'agent',name:'智能体运营'}];
const AI_SUB_TABS=[{id:'ai-main',name:'AI电力系统总览'},{id:'ai-source',name:'源侧响应'},{id:'ai-storage',name:'储能响应'},{id:'ai-supply',name:'供电侧(SST配储)'},{id:'ai-it',name:'IT侧响应'},{id:'ai-cooling',name:'制冷侧响应'}];
let currentTab='overview',currentSubTab='ai-main',gtTimeRange='30d',charts={};

function initTabs(){
  const nav=document.getElementById('main-tabs');
  nav.innerHTML=TABS.map(t=>`<button class="tab-btn${t.id===currentTab?' active':''}" data-tab="${t.id}">${t.name}</button>`).join('');
  nav.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
    currentTab=btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');renderPage();
  }));
}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false});}
setInterval(updateClock,1000);updateClock();

function renderPage(){
  const content=document.getElementById('content');
  switch(currentTab){
    case 'overview':content.innerHTML=renderOverview();break;
    case 'green-token':content.innerHTML=renderGreenToken();break;
    case 'carbon':content.innerHTML=renderCarbon();break;
    case 'prediction':content.innerHTML=renderPrediction();break;
    case 'ai-power':content.innerHTML=renderAIPower();setTimeout(()=>renderAISubPage(),40);return;
    case 'agent':content.innerHTML=renderAgent();break;
  }
  setTimeout(()=>initCharts(),80);
}

// ---------- OVERVIEW (matches reference image) ----------
function renderOverview(){
  return `<div class="page active">
    <div class="panel-center">
      <div class="scene-3d">
        <div class="scene-label"><b>AIDC</b> \u56ed\u533a\u6570\u5b57\u5b5e\u751f \u00b7 \u6e90\u7f51\u8377\u50a8\u5168\u666f</div>
        <div style="position:absolute;top:12px;right:16px;z-index:10;display:flex;gap:6px;align-items:center;">
          <button onclick="sceneAngle-=10;initCanvasScenes()" style="padding:4px 10px;font-size:11px;background:rgba(45,224,192,0.12);border:1px solid rgba(45,224,192,0.4);color:#2de0c0;border-radius:4px;cursor:pointer;">\u2190 \u5de6\u65cb</button>
          <span id="angle-display" style="font-size:11px;color:#5f7385;min-width:40px;text-align:center;">60\u00b0</span>
          <button onclick="sceneAngle+=10;initCanvasScenes()" style="padding:4px 10px;font-size:11px;background:rgba(45,224,192,0.12);border:1px solid rgba(45,224,192,0.4);color:#2de0c0;border-radius:4px;cursor:pointer;">\u53f3\u65cb \u2192</button>
          <button onclick="sceneTilt=Math.max(0.1,sceneTilt-0.08);initCanvasScenes()" style="padding:4px 8px;font-size:11px;background:rgba(45,224,192,0.08);border:1px solid rgba(45,224,192,0.3);color:#5f7385;border-radius:4px;cursor:pointer;">\u4fef</button>
          <button onclick="sceneTilt=Math.min(0.85,sceneTilt+0.08);initCanvasScenes()" style="padding:4px 8px;font-size:11px;background:rgba(45,224,192,0.08);border:1px solid rgba(45,224,192,0.3);color:#5f7385;border-radius:4px;cursor:pointer;">\u4ef0</button>
        </div>
        <canvas id="canvas-overview"></canvas>
      </div>
    </div>
    <div class="ov-grid">
      <div class="card card-corner" style="display:flex;flex-direction:column;"><div class="card-title">IT \u8d1f\u8377</div><div style="flex:1;min-height:0;" id="chart-ov-itload"></div></div>
      <div class="card card-corner" style="display:flex;flex-direction:column;"><div class="card-title">\u5355\u4f4dToken\u7535\u8017</div><div style="flex:1;min-height:0;" id="chart-ov-token"></div></div>
      <div class="card card-corner" style="display:flex;flex-direction:column;"><div class="card-title">\u7eff\u7535\u4f9b\u7ed9\u5360\u6bd4</div><div style="flex:1;min-height:0;" id="chart-ov-green"></div></div>
      <div class="card card-corner" style="display:flex;flex-direction:column;"><div class="card-title">PUE</div><div style="flex:1;min-height:0;" id="chart-ov-pue"></div></div>
    </div>
  </div>`;
}

function renderGreenToken(){
  const soc=MOCK.overview.bessSoc;
  const greenPct=MOCK.greenToken.greenPct;
  return `<div class="page active">
    <div class="panel-center">
      <div class="scene-3d">
        <div class="scene-label"><b>绿电全链路</b> 风机 → 升压站 → 降压站 → SST → IT机房</div>
        <canvas id="canvas-greentoken"></canvas>

// ============ CHARTS ============
const hours=Array.from({length:24},(_,i)=>i+':00');
const C={teal:'#2de0c0',cyan:'#33d1ff',green:'#00ff9d',gold:'#f5a623',red:'#ff8f7a',purple:'#a882ff',gray:'#5f7385'};
function area(color){return {type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:color+'55'},{offset:1,color:color+'00'}]};}
function theme(o={}){return Object.assign({backgroundColor:'transparent',tooltip:{trigger:'axis',backgroundColor:'rgba(6,14,24,0.9)',borderColor:'rgba(45,224,192,0.3)',textStyle:{color:'#c5d3e0',fontSize:11}},grid:{top:26,right:12,bottom:22,left:38},legend:{textStyle:{color:'#7d93a4',fontSize:10},top:0,itemWidth:12,itemHeight:8},xAxis:{type:'category',data:hours,boundaryGap:false,axisLine:{lineStyle:{color:'rgba(45,224,192,0.15)'}},axisLabel:{color:'#5f7385',fontSize:9,interval:3},axisTick:{show:false}},yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(45,224,192,0.06)'}},axisLabel:{color:'#5f7385',fontSize:9}}},o);}
function mk(el,series,o={}){if(!document.getElementById(el))return;const c=echarts.init(document.getElementById(el));c.setOption(Object.assign(theme(o),{series}));charts[el]=c;}
function line(name,data,color,fill=false){return {name,type:'line',smooth:true,symbol:'none',data,lineStyle:{color,width:2},itemStyle:{color},areaStyle:fill?{color:area(color)}:undefined};}

function initCharts(){
  Object.values(charts).forEach(c=>{try{c.dispose();}catch(e){}});charts={};
  ({overview:initOverviewCharts,'green-token':initGreenTokenCharts,carbon:initCarbonCharts,prediction:initPredictionCharts,'ai-power':initAIPowerCharts,agent:initAgentCharts}[currentTab]||(()=>{}))();
  initCanvasScenes();
}

function initOverviewCharts(){

  const tokenBars=Array.from({length:30},()=>+(0.9+Math.random()*0.55).toFixed(2));
  if(document.getElementById('chart-ov-token')){const c=echarts.init(document.getElementById('chart-ov-token'));c.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis',backgroundColor:'rgba(6,14,24,0.9)',borderColor:'rgba(45,224,192,0.3)',textStyle:{color:'#c5d3e0',fontSize:11}},grid:{top:20,right:10,bottom:22,left:50},xAxis:{type:'category',data:d30,name:'\u65e5\u671f',...xNm,axisLine:{lineStyle:{color:'rgba(45,224,192,0.15)'}},axisLabel:{color:'#5f7385',fontSize:9,interval:1,formatter:v=>Number(v)%2===0?v:''},axisTick:{show:false}},yAxis:{type:'value',name:'kWh/\u767e\u4e07Token',nameTextStyle:{color:'#5f7385',fontSize:9},min:0,max:2,splitLine:{lineStyle:{color:'rgba(45,224,192,0.06)'}},axisLabel:{color:'#5f7385',fontSize:9}},series:[{type:'bar',data:tokenBars,barWidth:'55%',itemStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:C.cyan},{offset:1,color:'rgba(51,209,255,0.15)'}]},borderRadius:[2,2,0,0]},markLine:{symbol:'none',lineStyle:{width:1.5},data:[{yAxis:1.5,lineStyle:{color:'#ff6b6b',type:'dashed'},label:{formatter:'\u884c\u4e1a\u5e73\u5747',color:'#ff6b6b',fontSize:9,position:'insideEndTop'}},{yAxis:1.0,lineStyle:{color:C.green,type:'dashed'},label:{formatter:'\u4f18\u5316\u76ee\u6807',color:C.green,fontSize:9,position:'insideEndTop'}}]}}]});charts['chart-ov-token']=c;}
  // Card 3: Green Ratio (12-month area)
  const m12=['01\u6708','02\u6708','03\u6708','04\u6708','05\u6708','06\u6708','07\u6708','08\u6708','09\u6708','10\u6708','11\u6708','12\u6708'];

// ============ ISOMETRIC 3D SCENE ============
let sceneAnimId=null;
function initCanvasScenes(){
  if(sceneAnimId)cancelAnimationFrame(sceneAnimId);
  const ad=document.getElementById('angle-display');if(ad)ad.textContent=sceneAngle+'\u00b0';
  const canvases=[...document.querySelectorAll('.scene-3d canvas')];
  if(!canvases.length)return;
  canvases.forEach(cv=>{
    const rect=cv.parentElement.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    cv.width=rect.width*dpr;cv.height=rect.height*dpr;
    cv.style.width=rect.width+'px';cv.style.height=rect.height+'px';
    cv._w=rect.width;cv._h=rect.height;cv._dpr=dpr;
  });
  const t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    canvases.forEach(cv=>{
      const ctx=cv.getContext('2d');
      ctx.setTransform(cv._dpr,0,0,cv._dpr,0,0);
      ctx.clearRect(0,0,cv._w,cv._h);
      drawScene(ctx,cv._w,cv._h,cv.id,t);
    });
    sceneAnimId=requestAnimationFrame(frame);
  }
  sceneAnimId=requestAnimationFrame(frame);
}

// iso projection (dynamic rotation + tilt controlled by UI buttons)
let SCENE_ROT=false, GCX=7, GCY=4.5;
var sceneAngle=50, sceneTilt=0.30; // angle in degrees, tilt = y-coefficient
function iso(cx,cy,x,y,z,s){
  const rad=sceneAngle*Math.PI/180;
  const cos=Math.cos(rad), sin=Math.sin(rad);
  const dx=x-GCX, dy=y-GCY;
  const rx=GCX + dx*cos + dy*sin;
  const ry=GCY - dx*sin + dy*cos;
  return {x:cx+(rx-ry)*s*0.86,y:cy+(rx+ry)*s*sceneTilt-z*s*(0.4+sceneTilt*1.2)};
}
function depthKey(x,y){
  const rad=sceneAngle*Math.PI/180;
  const cos=Math.cos(rad), sin=Math.sin(rad);
  const dx=x-GCX, dy=y-GCY;
  return (GCX+dx*cos+dy*sin)+(GCY-dx*sin+dy*cos);
}
function fill(ctx,pts,color){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fillStyle=color;ctx.fill();}
// draw a cuboid at grid x,y with size w,d,h (rotation-proof: all side faces sorted back-to-front)
function box(ctx,cx,cy,s,x,y,w,d,h,top,left,right){
  const corners=[[x,y],[x+w,y],[x+w,y+d],[x,y+d]];
  const bot=corners.map(p=>iso(cx,cy,p[0],p[1],0,s));
  const roof=corners.map(p=>iso(cx,cy,p[0],p[1],h,s));
  const faces=[];
  for(let i=0;i<4;i++){const j=(i+1)%4;
    faces.push({depth:(bot[i].y+bot[j].y+roof[i].y+roof[j].y)/4,pts:[bot[i],bot[j],roof[j],roof[i]],col:(i%2===0)?right:left});
  }
  faces.sort((a,b)=>a.depth-b.depth).forEach(f=>fill(ctx,f.pts,f.col));
  fill(ctx,roof,top);
}

function drawGridBG(ctx,w,h,t){

}

function drawOrb(ctx,x,y,r,label,sub,t,hue){

// flowing energy particle along a path of iso points
function drawFlow(ctx,pts,t,color,speed=0.35){
  for(let k=0;k<3;k++){
    let f=((t*speed+k/3)%1);
    // find segment
    const total=pts.length-1;const seg=Math.min(Math.floor(f*total),total-1);const lf=f*total-seg;
    const p=pts[seg],q=pts[seg+1];const x=p.x+(q.x-p.x)*lf,y=p.y+(q.y-p.y)*lf;
    ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
  }

// ---- routed energy pipe (glowing tube) with animated flow ----
function drawPipe(ctx,cx,cy,s,pts3d,color,t,opts={}){
  const P=pts3d.map(p=>iso(cx,cy,p[0],p[1],p[2],s));
  const w=opts.w||4;
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
  const stroke=(lw,col)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();};
  stroke(w+7,color+'1a');   // outer glow
  stroke(w+2,color+'55');   // mid
  stroke(Math.max(1,w*0.5),color+'e6'); // core
  ctx.restore();
  // flowing highlights
  const seg=[];let total=0;
  for(let i=0;i<P.length-1;i++){const d=Math.hypot(P[i+1].x-P[i].x,P[i+1].y-P[i].y);seg.push(d);total+=d;}
  if(total<1){return;}
  const speed=opts.speed||70,gap=opts.gap||44,dir=opts.dir===-1?-1:1;
  const n=Math.max(2,Math.floor(total/gap));
  for(let k=0;k<n;k++){
    let dist=(((t*speed*dir)+k*gap)%total+total)%total,acc=0,si=0;
    while(si<seg.length-1&&acc+seg[si]<dist){acc+=seg[si];si++;}
    const lf=seg[si]?(dist-acc)/seg[si]:0,a=P[si],b=P[si+1]||P[si];
    const x=a.x+(b.x-a.x)*lf,y=a.y+(b.y-a.y)*lf;
    ctx.beginPath();ctx.arc(x,y,opts.dot||2.4,0,Math.PI*2);
    ctx.fillStyle='#eafffb';ctx.shadowColor=color;ctx.shadowBlur=9;ctx.fill();ctx.shadowBlur=0;
  }
}
function drawLegend(ctx,w,h){

  let x=16,y=h-18;ctx.save();ctx.font='11px Microsoft YaHei';ctx.textBaseline='middle';
  items.forEach(it=>{

    ctx.fillStyle='#9fb4c2';ctx.textAlign='left';ctx.fillText(it[0],x+23,y);
    x+=23+ctx.measureText(it[0]).width+18;
  });
  ctx.restore();
}

function drawScene(ctx,w,h,id,t){
  // Dark background — no grid lines
  ctx.fillStyle='#04070e';ctx.fillRect(0,0,w,h);
  const cx=w*0.50, cy=h*0.24, s=Math.min(w,h)/20;
  const gw=14,gd=9; GCX=gw/2; GCY=gd/2;

  // White building helpers
  const W={top:'rgba(230,238,245,0.96)',left:'rgba(155,168,180,0.96)',right:'rgba(185,198,210,0.96)'};
  const WS={top:'rgba(210,220,228,0.96)',left:'rgba(130,142,154,0.96)',right:'rgba(160,172,184,0.96)'};

  // Main dark platform — clean, no grid
  (function(){
    const th=0.3,px0=-6,py0=0,px1=10.5,py1=gd;
    const t1=iso(cx,cy,px0,py0,0,s),t2=iso(cx,cy,px1,py0,0,s),t3=iso(cx,cy,px1,py1,0,s),t4=iso(cx,cy,px0,py1,0,s);
    const bc=[iso(cx,cy,px0,py0,-th,s),iso(cx,cy,px1,py0,-th,s),iso(cx,cy,px1,py1,-th,s),iso(cx,cy,px0,py1,-th,s)];

    pf.sort((a,b)=>a.depth-b.depth).forEach(f=>fill(ctx,f.pts,f.col));
    // top surface — very dark with subtle teal edge
    const g=ctx.createLinearGradient(t1.x,t1.y,t3.x,t3.y);
    g.addColorStop(0,'rgba(12,22,34,0.98)');g.addColorStop(1,'rgba(8,16,26,0.98)');
    fill(ctx,[t1,t2,t3,t4],g);

    ctx.strokeStyle='rgba(45,224,192,0.25)';ctx.lineWidth=1.2;

  })();

  const focus=id.replace('canvas-','');

  const tSpd=hot('wind')?4.5:1.5;
  const items=[];
  const add=(x,y,fn)=>items.push({d:depthKey(x,y),fn});

  // === WIND TURBINES (outside left) ===
  [[-4.5,1.0,0],[-4.8,3.0,1],[-4.5,5.0,2],[-4.8,7.0,0.5],[-4.5,8.5,1.5]].forEach(p=>add(p[0],p[1],()=>drawTurbine(ctx,cx,cy,s,p[0],p[1],t+p[2],tSpd)));

  add(9.6,4.5,()=>drawCoolingYard(ctx,cx,cy,s,9.0,3.8,2,2));

  // === LOWER ZONE: gate / office ===
  add(5.0,7.5,()=>box(ctx,cx,cy,s,4.3,7.0,1.4,0.7,0.4,WS.top,WS.left,WS.right));
  add(2.0,7.5,()=>box(ctx,cx,cy,s,1.2,7.0,2.0,0.9,0.6,WS.top,WS.left,WS.right));
  add(8.0,7.5,()=>drawParking(ctx,cx,cy,s,7.2,7.0,2.4,0.9));

  items.sort((a,b)=>a.d-b.d).forEach(it=>it.fn());

  // ---------- ZONE LABELS ----------
  function zoneLabel(gx,gy,gz,text,color){
    const p=iso(cx,cy,gx,gy,gz,s);
    ctx.save();ctx.font='bold 10px Microsoft YaHei';ctx.textAlign='center';ctx.textBaseline='middle';
    const tw=ctx.measureText(text).width;
    ctx.fillStyle='rgba(4,10,20,0.75)';ctx.beginPath();ctx.roundRect(p.x-tw/2-5,p.y-8,tw+10,16,3);ctx.fill();
    ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(p.x-tw/2-5,p.y-8,tw+10,16,3);ctx.stroke();
    ctx.fillStyle=color;ctx.fillText(text,p.x,p.y);ctx.restore();
  }
  zoneLabel(-2.0,1.5,1.5,'升压站A(风)','#c8d8e4');
  zoneLabel(-2.0,5.0,1.5,'升压站B(风+储)','#c8d8e4');
  zoneLabel(-4.8,4.5,2.0,'风机集群','#00ff9d');
  zoneLabel(1.2,0.2,1.8,'220kV降压站','#c8d8e4');
  zoneLabel(3.0,0.2,1.5,'10kV配电','#c8d8e4');
  zoneLabel(5.0,0.2,2.0,'SST','#2de0c0');
  zoneLabel(7.0,0.2,1.5,'BESS储能','#2de0c0');
  zoneLabel(9.2,0.2,1.5,'柴发(备用)','#c8d8e4');
  zoneLabel(5.0,3.8,2.0,'数据中心机房','#c8d8e4');
  zoneLabel(9.6,4.2,1.5,'制冷','#c8d8e4');

  // ---------- FOCUS HIGHLIGHT ----------
  function drawFocusHighlight(x0,y0,x1,y1,label,color){
    const corners=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    const pts=corners.map(p=>iso(cx,cy,p[0],p[1],1.5,s));
    const alpha=0.55+Math.sin(t*3)*0.25;
    ctx.save();
    ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.globalAlpha=alpha;ctx.setLineDash([6,3]);
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
    ctx.shadowColor=color;ctx.shadowBlur=18;ctx.lineWidth=1;ctx.globalAlpha=alpha*0.35;ctx.setLineDash([]);
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.setLineDash([]);
    const top=pts.reduce((a,b)=>a.y<b.y?a:b);
    ctx.font='bold 11px Microsoft YaHei';
    const tw=ctx.measureText(label).width;
    ctx.fillStyle='rgba(4,10,20,0.88)';ctx.beginPath();ctx.roundRect(top.x-tw/2-8,top.y-24,tw+16,20,4);ctx.fill();
    ctx.strokeStyle=color;ctx.lineWidth=1;ctx.globalAlpha=0.9;
    ctx.beginPath();ctx.roundRect(top.x-tw/2-8,top.y-24,tw+16,20,4);ctx.stroke();
    ctx.fillStyle=color;ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,top.x,top.y-14);
    ctx.restore();
  }
  if(focus==='ai-source')  drawFocusHighlight(-5.5,0.2,-3.2,9.2,'▶ 源侧响应激活',C.green);
  if(focus==='ai-storage') drawFocusHighlight(5.8,0.5,9.2,2.6,'▶ 储能出力激活',C.cyan);
  if(focus==='ai-supply')  drawFocusHighlight(3.8,0.5,6.2,2.6,'▶ SST配储调节',C.teal);
  if(focus==='ai-it')      drawFocusHighlight(0.4,2.5,10.6,6.6,'▶ IT算力调度激活',C.purple);
  if(focus==='ai-cooling') drawFocusHighlight(8.4,3.4,10.6,6.2,'▶ 制冷响应激活',C.red);

  // ---------- ENERGY FLOW PIPES — ground level (z=0.05) ----------
  const Z=0.05;
  // Green: wind → substations
  drawPipe(ctx,cx,cy,s,[[-4.5,2.0,Z],[-3.0,1.8,Z]],C.green,t,{w:3.5,speed:65});
  drawPipe(ctx,cx,cy,s,[[-4.5,6.0,Z],[-3.0,5.5,Z]],C.green,t,{w:3.5,speed:65});
  // Cyan: substations → 降压站 → power chain
  drawPipe(ctx,cx,cy,s,[[-2.0,2.0,Z],[0.7,1.3,Z]],C.cyan,t,{w:4,speed:75});
  drawPipe(ctx,cx,cy,s,[[-2.0,5.5,Z],[-1.0,3.5,Z],[-0.5,2.0,Z],[0.7,1.3,Z]],C.cyan,t,{w:3,speed:68});
  drawPipe(ctx,cx,cy,s,[[2.1,1.2,Z],[2.5,1.1,Z]],C.cyan,t,{w:3,speed:55});
  drawPipe(ctx,cx,cy,s,[[4.0,1.1,Z],[4.4,1.0,Z]],C.cyan,t,{w:3,speed:58});
  // Teal: BESS ↔ SST
  drawPipe(ctx,cx,cy,s,[[5.8,1.0,Z],[6.3,0.9,Z]],C.teal,t,{w:2.5,speed:40,dir:-1});
  // Main distribution: SST → DC halls (vertical drop)
  drawPipe(ctx,cx,cy,s,[[5.0,1.9,Z],[5.0,2.6,Z]],C.cyan,t,{w:4,speed:80});
  drawPipe(ctx,cx,cy,s,[[1.0,2.5,Z],[9.8,2.5,Z]],C.cyan,t,{w:3,speed:82});
  colX.forEach(xx=>{
    drawPipe(ctx,cx,cy,s,[[xx+0.9,2.5,Z],[xx+0.9,2.9,Z]],C.cyan,t,{w:2,speed:42,gap:20});
    drawPipe(ctx,cx,cy,s,[[xx+0.9,4.4,Z],[xx+0.9,4.8,Z]],C.cyan,t,{w:2,speed:42,gap:20});
  });
  // Gold: heat flow to cooling
  drawPipe(ctx,cx,cy,s,[[8.8,4.2,Z],[9.0,4.0,Z]],C.gold,t,{w:2.5,speed:38,gap:28});
  // Red: diesel standby (slow reverse)
  drawPipe(ctx,cx,cy,s,[[8.7,1.2,Z],[4.0,1.2,Z]],C.red,t,{w:1.5,speed:18,gap:55,dir:-1});

  drawFence(ctx,cx,cy,s,fx0,fy0,fx1,fy1);
  drawLegend(ctx,w,h);

  // ========== AI CONTROL LAYER ==========
  if(showAI){
    const enosPos={x:w*0.45,y:h*0.88};
    const tianshuPos=iso(cx,cy,-3.0,0.5,3.5,s);
    const tianjiPos={x:cx-s*1,y:h*0.05+Math.sin(t*1.2)*3};
    drawOrb(ctx,enosPos.x,enosPos.y,17,'EnOS','现场数据底座',t,'#33d1ff');
    drawOrb(ctx,tianshuPos.x,tianshuPos.y,20,'天枢','协同控制大脑',t+1,'#2de0c0');
    drawOrb(ctx,tianjiPos.x,tianjiPos.y,22,'天机','预测优化大脑',t+0.5,'#6ea8ff');
    const fc='#5599ff';
    const dv1=iso(cx,cy,2.0,3.5,1.2,s),dv2=iso(cx,cy,5.5,3.5,1.2,s),dv3=iso(cx,cy,8.5,4.0,1.2,s);
    drawInfoFlow(ctx,[dv1,enosPos],t,fc,0.7);
    drawInfoFlow(ctx,[dv2,enosPos],t+0.3,fc,0.7);
    drawInfoFlow(ctx,[dv3,enosPos],t+0.6,fc,0.7);
    drawInfoFlow(ctx,[enosPos,tianjiPos],t,fc,0.5);
    drawInfoFlow(ctx,[tianjiPos,tianshuPos],t,'#00e8a0',0.55);
    const ct1=iso(cx,cy,-3.0,2.0,1.0,s),ct2=iso(cx,cy,-3.0,5.5,1.0,s),ct3=iso(cx,cy,0.7,1.0,1.0,s);
    drawInfoFlow(ctx,[tianshuPos,ct1],t+0.2,'#00e8a0',0.6);
    drawInfoFlow(ctx,[tianshuPos,ct2],t+0.5,'#00e8a0',0.6);
    drawInfoFlow(ctx,[tianshuPos,ct3],t+0.8,'#00e8a0',0.6);
    ctx.save();ctx.font='9px Microsoft YaHei';ctx.textAlign='center';
    ctx.fillStyle=fc;ctx.globalAlpha=0.85;
    ctx.fillText('状态感知',enosPos.x-30,enosPos.y-16);
    ctx.fillText('趋势预测',(enosPos.x+tianjiPos.x)/2+20,(enosPos.y+tianjiPos.y)/2);
    ctx.fillStyle='#00e8a0';
    ctx.fillText('策略生成',(tianjiPos.x+tianshuPos.x)/2,(tianjiPos.y+tianshuPos.y)/2-10);
    ctx.fillText('调度执行',tianshuPos.x+35,tianshuPos.y+24);
    ctx.restore();
  } // end showAI
} // end drawScene

// AI info-flow: dashed pulsing line with flowing dot + optional label
function drawInfoFlow(ctx,pts,t,color,speed,label){
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.setLineDash([6,4]);
  ctx.globalAlpha=0.45+Math.sin(t*3)*0.2;
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;
  const total=pts.length-1;const f=((t*speed)%1+1)%1;
  const seg=Math.min(Math.floor(f*total),total-1),lf=f*total-seg;
  const a=pts[seg],b=pts[seg+1]||pts[seg];
  const px=a.x+(b.x-a.x)*lf,py=a.y+(b.y-a.y)*lf;
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor=color;ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
  if(label){const mx=(pts[0].x+pts[pts.length-1].x)/2,my=(pts[0].y+pts[pts.length-1].y)/2-9;
    ctx.font='10px Microsoft YaHei';ctx.textAlign='center';ctx.fillStyle=color;ctx.globalAlpha=0.85;ctx.fillText(label,mx,my);}
  ctx.restore();
}

// ============ EVENTS & INIT ============
document.addEventListener('click',e=>{
  if(e.target.classList.contains('sub-tab-btn')){
    currentSubTab=e.target.dataset.subtab;
    document.querySelectorAll('.sub-tab-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    renderAISubPage();
  }
});
let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{Object.values(charts).forEach(c=>{try{c.resize();}catch(e){}});initCanvasScenes();},200);});
initTabs();renderPage();
</script>
